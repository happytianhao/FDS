[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "fds-robotics"
version = "0.1.0"
description = "Falsifiable Decision State harness for RoboMME and RoboMME-Plus"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
dependencies = ["numpy>=1.26,<2", "pillow>=10", "jsonschema>=4.23", "websockets>=15,<16"]

[project.optional-dependencies]
api = ["openai>=2"]
weights = ["google-crc32c>=1.6,<2"]
dev = ["pytest>=8", "ruff>=0.11"]

[project.scripts]
fds = "fds.cli:main"
fds-meta = "fds.meta_harness.cli:main"
fds-visualize = "fds.visualize:main"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/configs", "/requirements",
           "/pyproject.toml", "/uv.lock", "/README.md", "/LICENSE", "/.gitignore"]
exclude = ["**/*.local.toml", "**/__pycache__", "**/*.pyc"]

[tool.hatch.build.targets.wheel]
packages = ["src/fds"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
